<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nuevo Ingreso NNA</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #f8f9fa; }
        h2 { font-size: 18px; color: #333; margin-top: 0; }
        .btn-clipboard { width: 100%; background-color: #198754; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }
        .btn-clipboard:hover { background-color: #146c43; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #495057; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        .btn-submit { width: 100%; background-color: #0d6efd; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0b5ed7; }
        .btn-submit:disabled { background-color: #6c757d; cursor: not-allowed; }
        .msg-status { margin-top: 10px; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Nuevo ingreso</h2>
    
    <button class="btn-clipboard" type="button" onclick="pegarPortapapeles()">📋 Pegar Ficha desde Portapapeles</button>

    <form id="formIngreso">
        <div class="form-group">
            <label>Equipo integrado:</label>
            <select id="dupla">
                <option value="M/C">Mariana / Claudia (M/C)</option>
                <option value="L/C">Liliana / Claudia (L/C)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nombres:</label>
            <input type="text" id="nombres" required>
        </div>

        <div class="form-group">
            <label>Apellido paterno:</label>
            <input type="text" id="apellidoPaterno" required>
        </div>

        <div class="form-group">
            <label>Apellido materno:</label>
            <input type="text" id="apellidoMaterno" required>
        </div>

        <div class="form-group">
            <label>Cédula de Identidad (RUT):</label>
            <input type="text" id="rut" placeholder="12.345.678-K" required>
        </div>

        <div class="form-group">
            <label>RIT (X-123-AAAA):</label>
            <input type="text" id="rit" placeholder="X-" required>
        </div>

        <div class="form-group">
            <label>Fecha de nacimiento:</label>
            <input type="date" id="fechaNacimiento" required>
        </div>

        <div class="form-group">
            <label>Fecha de ingreso:</label>
            <input type="date" id="fechaIngreso" required>
        </div>

        <div class="form-group">
            <label>Dirección:</label>
            <input type="text" id="direccion" required>
        </div>

        <div class="form-group">
            <label>CESFAM:</label>
            <input type="text" id="cesfam">
        </div>

        <div class="form-group">
            <label>Colegio:</label>
            <input type="text" id="colegio">
        </div>

        <button type="button" id="btnGuardar" class="btn-submit" onclick="guardarDatos()">Guardar Ingreso</button>
        <div id="status" class="msg-status"></div>
    </form>

    <script>
        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                console.log("Office Ready en Excel");
            }
        });

        // Limpiar formato RUT para comparación
        function limpiarRut(rut) {
            return String(rut || "").replace(/[^0-9kK]/g, "").toUpperCase();
        }

        // Formatear nombres en formato Nombre Propio
        function properCase(texto) {
            if (!texto) return "";
            return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        }

        async function guardarDatos() {
            const btn = document.getElementById('btnGuardar');
            const status = document.getElementById('status');
            
            // 1. Obtener valores del formulario
            const dupla = document.getElementById('dupla').value;
            const nombres = document.getElementById('nombres').value.trim();
            const apellidoPaterno = document.getElementById('apellidoPaterno').value.trim();
            const apellidoMaterno = document.getElementById('apellidoMaterno').value.trim();
            const rut = document.getElementById('rut').value.trim();
            const rit = document.getElementById('rit').value.trim();
            const fechaNacimiento = document.getElementById('fechaNacimiento').value;
            const fechaIngreso = document.getElementById('fechaIngreso').value;
            const direccion = document.getElementById('direccion').value.trim();
            const cesfam = document.getElementById('cesfam').value.trim();
            const colegio = document.getElementById('colegio').value.trim();

            if (!nombres || !apellidoPaterno || !rut || !fechaNacimiento || !fechaIngreso) {
                alert("Por favor complete los campos obligatorios.");
                return;
            }

            btn.disabled = true;
            status.style.color = "blue";
            status.innerText = "Guardando en Excel...";

            try {
                await Excel.run(async (context) => {
                    const sheet = context.workbook.worksheets.getItem("ESTADO CASOS");
                    
                    // 2. Obtener la última fila usada leyendo la columna B
                    const rangeB = sheet.getRange("B:B").getUsedRange();
                    rangeB.load("rowCount", "rowIndex");
                    await context.sync();

                    let nextRow = 4; // Por defecto fila 4 si está vacía
                    if (rangeB) {
                        nextRow = rangeB.rowIndex + rangeB.rowCount + 1;
                    }
                    if (nextRow < 4) nextRow = 4;

                    // 3. Validar duplicidad de RUT
                    if (nextRow > 4) {
                        const rangeRuts = sheet.getRange(`E4:E${nextRow - 1}`);
                        rangeRuts.load("values");
                        await context.sync();

                        const rutLimpioIngresado = limpiarRut(rut);
                        for (let i = 0; i < rangeRuts.values.length; i++) {
                            const rutExistente = limpiarRut(rangeRuts.values[i][0]);
                            if (rutExistente && rutExistente === rutLimpioIngresado) {
                                throw new Error(`El RUT "${rut}" ya existe en la fila ${4 + i}.`);
                            }
                        }
                    }

                    // Primer nombre formateado para objetivos
                    const primerNombre = properCase(nombres.split(" ")[0]);

                    // 4. Escribir los datos directos en la fila correspondiente
                    // Col A: Dupla, B: Nombres, C: Paterno, D: Materno, E: RUT, F: RIT
                    sheet.getRange(`A${nextRow}:F${nextRow}`).values = [[
                        dupla, nombres, apellidoPaterno, apellidoMaterno, rut, rit
                    ]];

                    // Col H: Fecha Nacimiento, I: Fecha Ingreso
                    sheet.getRange(`H${nextRow}:I${nextRow}`).values = [[
                        fechaNacimiento, fechaIngreso
                    ]];

                    // Col L: Dirección, M: CESFAM, N: Colegio
                    sheet.getRange(`L${nextRow}:N${nextRow}`).values = [[
                        direccion, cesfam, colegio
                    ]];

                    // Col P: Etapa Inicial "INGRESO"
                    sheet.getRange(`P${nextRow}`).values = [["INGRESO"]];

                    // 5. Insertar fórmulas nativas de Excel
                    // Col G: Edad calculada
                    sheet.getRange(`G${nextRow}`).formulas = [[`=DATEDIF(H${nextRow}, TODAY(), "Y") & " años"`]];

                    // Col J: Próxima evaluación (fórmula de 3 meses / 24 meses)
                    sheet.getRange(`J${nextRow}`).formulas = [[
                        `=IF(OR(P${nextRow}="EGRESADO", DATEDIF(I${nextRow}, TODAY(), "M") >= 24), "Finalizado", EDATE(I${nextRow}, (INT((DATEDIF(I${nextRow}, TODAY(), "M")) / 3) + 1) * 3))`
                    ]];

                    // Col Q: Estado Alerta
                    sheet.getRange(`Q${nextRow}`).formulas = [[`=IF(S${nextRow}<TODAY()-7, "Actualizar", "Listo")`]];

                    // Col R: Fecha Inicio Etapa y Col S: Fecha Término
                    sheet.getRange(`R${nextRow}`).formulas = [[`=I${nextRow}`]];
                    sheet.getRange(`S${nextRow}`).formulas = [[`=EDATE(I${nextRow}, 1)`]];

                    // Col X e Y: Objetivos por defecto
                    sheet.getRange(`X${nextRow}`).values = [[`Generar conocimiento de las redes en las cuales se encuentra inserto ${primerNombre} y su familia, intencionando un trabajo colaborativo, potenciando espacios protectores.`]];
                    sheet.getRange(`Y${nextRow}`).values = [[`Desarrollar y fortalecer espacios de participación conociendo interés, opiniones y propuestas de ${primerNombre} y su familia según su trayectoria vital.`]];

                    await context.sync();
                });

                status.style.color = "green";
                status.innerText = "¡Ingreso guardado con éxito!";
                document.getElementById('formIngreso').reset();

            } catch (err) {
                status.style.color = "red";
                status.innerText = "Error: " + err.message;
                alert(err.message);
            } finally {
                btn.disabled = false;
            }
        }

        async function pegarPortapapeles() {
            try {
                const texto = await navigator.clipboard.readText();
                if (!texto.trim()) {
                    alert("El portapapeles está vacío.");
                    return;
                }

                const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);

                if (lineas.length > 0) {
                    const palabras = lineas[0].split(/\s+/);
                    if (palabras.length >= 3) {
                        document
