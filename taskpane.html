<?xml version="1.0" encoding="UTF-8"?>
<OfficeApp
    xmlns="http://schemas.microsoft.com/office/appforoffice/1.1"
    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xmlns:bt="http://schemas.microsoft.com/office/officeappbasictypes/1.0"
    xsi:type="TaskPaneApp">

  <Id>b29f9872-3c1a-4d2a-8723-9876543210ab</Id>
  <Version>1.0.0.1</Version>
  <ProviderName>La Protectora</ProviderName>
  <DefaultLocale>es-ES</DefaultLocale>

  <DisplayName DefaultValue="Gestión NNA" />
  <Description DefaultValue="Complemento para la gestión y seguimiento de casos NNA." />

  <IconUrl DefaultValue="https://appsforoffice.microsoft.com/fabric/assets/icons/excel-32x32.png" />
  <SupportUrl DefaultValue="https://www.laprotectora.cl" />

  <AppDomains>
    <AppDomain>https://suarezaft.github.io</AppDomain>
  </AppDomains>

  <Hosts>
    <Host Name="Workbook" />
  </Hosts>

  <DefaultSettings>
    <SourceLocation DefaultValue="https://suarezaft.github.io/formulario-excel/taskpane-ingreso.html" />
  </DefaultSettings>

  <Permissions>ReadWriteDocument</Permissions>

  <VersionOverrides
      xmlns="http://schemas.microsoft.com/office/taskpaneappversionoverrides"
      xsi:type="VersionOverridesV1_0">

    <Hosts>
      <Host xsi:type="Workbook">

        <DesktopFormFactor>

          <ExtensionPoint xsi:type="PrimaryCommandSurface">

            <CustomTab id="TabGestionNNA">

              <Group id="GroupGestionNNA">

                <Label resid="GroupLabel" />

                <Icon>
                  <bt:Image size="16" resid="Icon16" />
                  <bt:Image size="32" resid="Icon32" />
                  <bt:Image size="80" resid="Icon80" />
                </Icon>

                <!-- Botón 1: Nuevo Ingreso -->
                <Control xsi:type="Button" id="ButtonNuevoIngreso">
                  <Label resid="BtnIngresoLabel" />
                  <Supertip>
                    <Title resid="SuperIngresoTitle" />
                    <Description resid="SuperIngresoDesc" />
                  </Supertip>
                  <Icon>
                    <bt:Image size="16" resid="Icon16" />
                    <bt:Image size="32" resid="Icon32" />
                    <bt:Image size="80" resid="Icon80" />
                  </Icon>
                  <Action xsi:type="ShowTaskpane">
                    <TaskpaneId>TaskpaneIngreso</TaskpaneId>
                    <SourceLocation resid="TaskpaneIngreso.Url" />
                  </Action>
                </Control>

                <!-- Botón 2: Actualizar Intervención -->
                <Control xsi:type="Button" id="ButtonActualizarIntervencion">
                  <Label resid="BtnActualizarLabel" />
                  <Supertip>
                    <Title resid="SuperActualizarTitle" />
                    <Description resid="SuperActualizarDesc" />
                  </Supertip>
                  <Icon>
                    <bt:Image size="16" resid="Icon16" />
                    <bt:Image size="32" resid="Icon32" />
                    <bt:Image size="80" resid="Icon80" />
                  </Icon>
                  <Action xsi:type="ShowTaskpane">
                    <TaskpaneId>TaskpaneActualizar</TaskpaneId>
                    <SourceLocation resid="TaskpaneActualizar.Url" />
                  </Action>
                </Control>

              </Group>

              <Label resid="TabLabel" />

            </CustomTab>

          </ExtensionPoint>

        </DesktopFormFactor>

      </Host>
    </Hosts>

    <Resources>

      <bt:Images>
        <bt:Image id="Icon16" DefaultValue="https://appsforoffice.microsoft.com/fabric/assets/icons/excel-16x16.png" />
        <bt:Image id="Icon32" DefaultValue="https://appsforoffice.microsoft.com/fabric/assets/icons/excel-32x32.png" />
        <bt:Image id="Icon80" DefaultValue="https://appsforoffice.microsoft.com/fabric/assets/icons/excel-80x80.png" />
      </bt:Images>

      <bt:Urls>
        <bt:Url id="TaskpaneIngreso.Url" DefaultValue="https://suarezaft.github.io/formulario-excel/taskpane-ingreso.html" />
        <bt:Url id="TaskpaneActualizar.Url" DefaultValue="https://suarezaft.github.io/formulario-excel/taskpane-actualizar.html" />
      </bt:Urls>

      <bt:ShortStrings>
        <bt:String id="GroupLabel" DefaultValue="Gestión de Casos" />
        <bt:String id="TabLabel" DefaultValue="La Protectora" />
        <bt:String id="BtnIngresoLabel" DefaultValue="Nuevo Ingreso" />
        <bt:String id="SuperIngresoTitle" DefaultValue="Registrar Nuevo Ingreso" />
        <bt:String id="BtnActualizarLabel" DefaultValue="Actualizar Intervención" />
        <bt:String id="SuperActualizarTitle" DefaultValue="Actualizar Caso" />
      </bt:ShortStrings>

      <bt:LongStrings>
        <bt:String id="SuperIngresoDesc" DefaultValue="Abre el formulario para ingresar un nuevo NNA." />
        <bt:String id="SuperActualizarDesc" DefaultValue="Abre el panel para modificar las intervenciones del NNA." />
      </bt:LongStrings>

    </Resources>

  </VersionOverrides>

</OfficeApp>
