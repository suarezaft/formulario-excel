<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imprimir Certificado</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; color: #333; font-size: 13px; }
        h3 { color: #0078d4; margin-top: 0; }
        .campo { margin-bottom: 12px; }
        label { font-weight: bold; display: block; margin-bottom: 4px; }
        input[type="text"], input[type="date"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }
        
        .hora-container { display: flex; align-items: center; gap: 4px; }
        .hora-grupo { display: flex; align-items: center; gap: 2px; flex: 1; }
        .hora-grupo select { padding: 6px 2px; text-align: center; }
        .hora-separador { font-weight: bold; color: #666; padding: 0 4px; }

        .info-box { background-color: #f3f2f1; padding: 8px; border-radius: 4px; border-left: 4px solid #0078d4; margin-bottom: 12px; font-weight: bold; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; }
        .checkbox-container input { width: auto; }
        .btn-imprimir { width: 100%; background-color: #0078d4; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 15px; }
        .btn-imprimir:hover { background-color: #005a9e; }
        .btn-imprimir:disabled { background-color: #a19f9d; cursor: not-allowed; }
        .oculto { display: none; }
        .error { color: #d13438; font-size: 11px; margin-top: 4px; display: block; word-break: break-all; }
        .alerta-cargando { background-color: #fff4ce; color: #797775; padding: 10px; border-radius: 4px; border: 1px solid #ffb900; margin-top: 12px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h3>Certificado de Atención</h3>

    <div id="msgStatus" class="campo"></div>

    <!-- 1. Menú Desplegable NNA -->
    <div class="campo">
        <label for="selectNNA">Seleccionar NNA:</label>
        <select id="selectNNA" onchange="actualizarClasificacionEdad()">
            <option value="">Cargando lista...</option>
        </select>
    </div>

    <!-- 2. Clasificación de Edad y RUT -->
    <div class="info-box">
        Clasificación: <span id="lblClasificacion">Seleccione un NNA...</span><br/>
        <small style="font-weight: normal; color: #555;">RUT: <span id="lblRut">-</span></small>
    </div>

    <!-- 3. Fecha de Emisión -->
    <div class="campo">
        <label for="dtFecha">Fecha del Certificado:</label>
        <input type="date" id="dtFecha" />
    </div>

    <!-- 4. Hora de Atención -->
    <div class="campo">
        <label>Hora de Atención:</label>
        <div class="hora-container">
            <div class="hora-grupo">
                <select id="hInicio">
                    <option value="08">08</option>
                    <option value="09" selected>09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                </select>
                <span>:</span>
                <select id="mInicio">
                    <option value="00" selected>00</option>
                    <option value="15">15</option>
                    <option value="30">30</option>
                    <option value="45">45</option>
                </select>
            </div>

            <span class="hora-separador">a</span>

            <div class="hora-grupo">
                <select id="hFin">
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10" selected>10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                    <option value="17">17</option>
                    <option value="18">18</option>
                </select>
                <span>:</span>
                <select id="mFin">
                    <option value="00" selected>00</option>
                    <option value="15">15</option>
                    <option value="30">30</option>
                    <option value="45">45</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 5. Acompañante -->
    <div class="campo">
        <label for="txtAcompanante">¿Con quién vino a atención? *</label>
        <input type="text" id="txtAcompanante" placeholder="Ej: Madre, Padre, Tutor legal" />
        <span id="errAcompanante" class="error oculto">Este campo es obligatorio</span>
    </div>

    <!-- 6. Casilla opcional: Dónde se presentará -->
    <div class="campo">
        <label class="checkbox-container">
            <input type="checkbox" id="chkPresentar" onchange="togglePresentar()" />
            ¿Desea añadir dónde se presentará?
        </label>
    </div>

    <div id="divPresentar" class="campo oculto">
        <label for="txtPresentarEn">Para ser presentado en...</label>
        <input type="text" id="txtPresentarEn" placeholder="Ej: Establecimiento Educacional, Tribunal..." />
    </div>

    <button id="btnGenerar" class="btn-imprimir" onclick="generarEImprimir()">📄 Generar e Imprimir</button>

    <div id="msgCargando" class="alerta-cargando oculto">
        ⏳ Generando documento desde plantilla Word...
    </div>

    <iframe id="printFrame" style="display:none;"></iframe>

    <script>
        // PEGA AQUÍ LA URL COMPLETA DE TU DETONADOR DE POWER AUTOMATE
        const URL_POWER_AUTOMATE = "https://default3e5917a4037e4729987a895e2b7724.df.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/11/workflows/dcb75c74f531486a80dd8db03eed9ace/triggers/manual/paths/invoke?api-version=1";

        let listaNNAs = [];

        function obtenerFechaHoyISO() {
            const hoy = new Date();
            const year = hoy.getFullYear();
            const month = String(hoy.getMonth() + 1).padStart(2, '0');
            const day = String(hoy.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatearFechaTexto(fechaISO) {
            if (!fechaISO) return "";
            
            const meses = [
                "enero", "febrero", "marzo", "abril", "mayo", "junio",
                "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
            ];
            
            const partes = fechaISO.split("-");
            const ano = partes[0];
            const mesIndex = parseInt(partes[1], 10) - 1;
            const dia = String(parseInt(partes[2], 10)).padStart(2, '0');
            
            return `${dia} de ${meses[mesIndex]} de ${ano}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const inputFecha = document.getElementById("dtFecha");
            if (inputFecha) inputFecha.value = obtenerFechaHoyISO();
        });

        Office.onReady((info) => {
            if (info.host === Office.HostType.Excel) {
                cargarDatosEstadoCasos();
            } else {
                mostrarError("Ejecutar dentro de Microsoft Excel.");
            }
        });

        function mostrarError(mensaje) {
            const divStatus = document.getElementById("msgStatus");
            divStatus.innerHTML = `<span class="error">⚠️ ${mensaje}</span>`;
            const combo = document.getElementById("selectNNA");
            combo.innerHTML = '<option value="">-- Error al cargar --</option>';
        }

        async function cargarDatosEstadoCasos() {
            try {
                await Excel.run(async (context) => {
                    const worksheets = context.workbook.worksheets;
                    worksheets.load("items/name");
                    await context.sync();

                    let sheet = null;
                    for (let i = 0; i < worksheets.items.length; i++) {
                        if (worksheets.items[i].name.trim().toUpperCase() === "ESTADO CASOS") {
                            sheet = worksheets.items[i];
                            break;
                        }
                    }

                    if (!sheet) {
                        mostrarError('No se encontró la pestaña "ESTADO CASOS".');
                        return;
                    }

                    const rangeTotal = sheet.getRange("A2:P500");
                    rangeTotal.load("values");

                    await context.sync();

                    const combo = document.getElementById("selectNNA");
                    combo.innerHTML = '<option value="">-- Seleccionar --</option>';
                    listaNNAs = [];

                    const filas = rangeTotal.values;

                    for (let i = 0; i < filas.length; i++) {
                        const fila = filas[i];
                        
                        // Índices: B=1 (Nombre), C=2 (Ap. Paterno), D=3 (Ap. Materno), E=4 (RUT), G=6 (Edad), P=15 (Estado)
                        const nombre = fila[1];
                        const apPaterno = fila[2];
                        const apMaterno = fila[3];
                        const rutVal = String(fila[4] || "").trim();
                        const edadRaw = String(fila[6] || ""); 
                        const estadoP = String(fila[15] || "").trim().toUpperCase();

                        if (nombre && String(nombre).trim() !== "" && estadoP !== "EGRESADO") {
                            const nomPropio = `${nombre} ${apPaterno || ''} ${apMaterno || ''}`.replace(/\s+/g, ' ').trim();
                            const numeroEdad = parseInt(edadRaw.replace(/\D/g, ""), 10) || 0;
                            const clasificacion = numeroEdad <= 11 ? "Niño/a" : "Adolescente";

                            listaNNAs.push({
                                nomPropio: nomPropio,
                                rut: rutVal || "Sin RUT",
                                clasificacion: clasificacion
                            });

                            const opt = document.createElement("option");
                            opt.value = listaNNAs.length - 1;
                            opt.textContent = nomPropio;
                            combo.appendChild(opt);
                        }
                    }

                    if (listaNNAs.length === 0) {
                        combo.innerHTML = '<option value="">No hay casos activos disponibles</option>';
                    }
                });
            } catch (error) {
                console.error("Error al cargar datos:", error);
                mostrarError("Error al leer Excel: " + (error.message || error));
            }
        }

        function actualizarClasificacionEdad() {
            const index = document.getElementById("selectNNA").value;
            const lbl = document.getElementById("lblClasificacion");
            const lblRut = document.getElementById("lblRut");

            if (index !== "") {
                lbl.textContent = listaNNAs[index].clasificacion;
                lblRut.textContent = listaNNAs[index].rut;
            } else {
                lbl.textContent = "Seleccione un NNA...";
                lblRut.textContent = "-";
            }
        }

        function togglePresentar() {
            const chk = document.getElementById("chkPresentar").checked;
            const div = document.getElementById("divPresentar");
            div.classList.toggle("oculto", !chk);
        }

        function generarEImprimir() {
            const select = document.getElementById("selectNNA");
            const acompanante = document.getElementById("txtAcompanante").value.trim();
            const errAcom = document.getElementById("errAcompanante");
            const btnGenerar = document.getElementById("btnGenerar");
            const msgCargando = document.getElementById("msgCargando");

            if (!acompanante) {
                errAcom.classList.remove("oculto");
                return;
            } else {
                errAcom.classList.add("oculto");
            }

            if (select.value === "") {
                alert("Por favor, seleccione un NNA de la lista.");
                return;
            }

            const nnaSeleccionado = listaNNAs[select.value];
            
            const rawFecha = document.getElementById("dtFecha").value || obtenerFechaHoyISO();
            const fechaFormateada = formatearFechaTexto(rawFecha);

            const horaInicio = `${document.getElementById("hInicio").value}:${document.getElementById("mInicio").value}`;
            const horaFin = `${document.getElementById("hFin").value}:${document.getElementById("mFin").value}`;

            let presentarEn = "";
            if (document.getElementById("chkPresentar").checked) {
                presentarEn = document.getElementById("txtPresentarEn").value.trim();
            }

            btnGenerar.disabled = true;
            msgCargando.classList.remove("oculto");

            const payload = {
                nna: nnaSeleccionado.nomPropio,
                rut: nnaSeleccionado.rut,
                clasificacion: nnaSeleccionado.clasificacion,
                fecha: fechaFormateada,
                acompanante: acompanante,
                presentarEn: presentarEn,
                horaInicio: horaInicio,
                horaFin: horaFin
            };

            fetch(URL_POWER_AUTOMATE, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error("Error en el servicio de generación");
                return response.blob();
            })
            .then(pdfBlob => {
                const blobUrl = URL.createObjectURL(pdfBlob);
                const printFrame = document.getElementById("printFrame");
                
                printFrame.src = blobUrl;
                printFrame.onload = function() {
                    printFrame.contentWindow.focus();
                    printFrame.contentWindow.print();

                    btnGenerar.disabled = false;
                    msgCargando.classList.add("oculto");
                };
            })
            .catch(error => {
                alert("Ocurrió un error al generar la impresión: " + error.message);
                btnGenerar.disabled = false;
                msgCargando.classList.add("oculto");
            });
        }
    </script>
</body>
</html>
