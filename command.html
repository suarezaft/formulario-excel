<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Comandos de Ejecución Directa</title>
    <!-- Cargar la API oficial de Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
</head>
<body>
    <script>
        Office.onReady();

        async function imprimirCertificadoNativo(event) {
            try {
                await Excel.run(async (context) => {
                    // 1. Obtener la hoja "Certif. Atención"
                    const sheet = context.workbook.worksheets.getItem("Certif. Atención");

                    // 2. Configurar el área de impresión para las columnas A a la F
                    const pageLayout = sheet.pageLayout;
                    pageLayout.setPrintArea("A:F");

                    // 3. Ajustar para que quepa en 1 página de ancho
                    pageLayout.zoom = {
                        horizontalFitToPages: 1,
                        verticalFitToPages: 0
                    };

                    // 4. Exportar el contenido nativo a PDF (mantiene logos, colores e imágenes)
                    const pdfResult = sheet.getAsPdf();
                    await context.sync();

                    // 5. Convertir a archivo descargable
                    const base64Data = pdfResult.value;
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: "application/pdf" });

                    // 6. Descargar el archivo PDF en la carpeta local
                    const fileName = `Certificado_${Date.now()}.pdf`;
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                });
            } catch (error) {
                console.error("Error al exportar PDF:", error);
            }

            // Notificar a Office que la función terminó
            if (event) {
                event.completed();
            }
        }

        // Asociar la función para que el Ribbon la reconozca
        Office.actions.associate("imprimirCertificadoNativo", imprimirCertificadoNativo);
    </script>
</body>
</html>
